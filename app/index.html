<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leonida Trophy Atlas</title><link rel="stylesheet" href="style.css"></head>
<body><header class="top"><div><p class="kicker">PS5 / 55 TROPHIES</p><h1>Leonida Trophy Atlas</h1><p class="sub">A focused route to the platinum, with a local checklist that stays in your browser.</p></div><div class="summary"><strong id="earnedCount">0 / 55</strong><span id="percent">0%</span><div class="bar"><i id="progressBar"></i></div><div id="gradeCounts" class="grade-counts"></div></div></header>
<main><nav class="views" aria-label="Atlas views"><a href="#view=checklist">Checklist</a><a href="#view=roadmap">Roadmap</a><a href="#view=missables">Missables</a></nav><section class="toolbar"><div class="search"><label for="search">Find a trophy</label><input id="search" type="search" placeholder="Search names, descriptions, guides"></div><div class="chips" id="kindFilters"></div><label class="select-label">Grade<select id="grade"><option value="all">All grades</option><option>platinum</option><option>gold</option><option>silver</option><option>bronze</option></select></label><label class="toggle"><input id="hideEarned" type="checkbox"><span>Hide earned</span></label><label class="toggle"><input id="spoiler" type="checkbox"><span>Spoiler mode</span></label><button id="export" class="action">Export</button><button id="import" class="action">Import</button><input id="file" type="file" accept="application/json" hidden></section>
<section id="roadmap" class="roadmap"></section><div class="content"><section><div class="view-head"><div><p class="kicker">CHECKLIST</p><h2 id="listTitle">All trophies</h2></div><span id="resultCount"></span></div><div id="list" class="list"></div></section><aside id="detail" class="detail"></aside></div></main><footer>Shareable tracker links preserve earned IDs and an open trophy. <code>?earned=2,5&open=5</code></footer><script src="app.js"></script></body></html>
